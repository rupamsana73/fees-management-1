{% extends "base.html" %}

{% block title %}Profile Setup Required | FeeFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0 p-4 text-center">
            <div class="display-5 text-primary mb-3"><i class="bi bi-person-vcard"></i></div>
            <h1 class="h3">Student profile setup required</h1>
            <p class="text-secondary">Your account is active, but it is not linked to a student profile yet. Please contact an administrator to complete your setup.</p>
            <a class="btn btn-primary" href="{% url 'logout' %}">Sign out</a>
        </div>
    </div>
</div>
{% endblock %}
