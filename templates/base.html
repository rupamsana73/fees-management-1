<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FeeFlow | Student Fee Management System{% endblock %}</title>
    <meta name="description" content="FeeFlow Student Fee Management System for Debasis Kamila">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f4f7ff 0%, #eef8f7 100%); }
        .brand-shell { max-width: 440px; margin: 0 auto 1.5rem; text-align: center; }
        .brand-badge { display: inline-flex; align-items: center; gap: 12px; background: #fff; border: 1px solid rgba(91,92,226,.18); box-shadow: 0 14px 38px rgba(91,92,226,.12); border-radius: 16px; padding: 12px 18px; }
        .brand-badge .brand-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #5b5ce2, #7b7deb); color: #fff; font-weight: 700; }
        .brand-text { font-size: 1.8rem; font-weight: 800; letter-spacing: -.05em; color: #1b2238; }
        .brand-accent { color: #16a89a; }
        .brand-subtitle { color: #65728a; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
        .auth-card { border: 0; border-radius: 20px; box-shadow: 0 24px 60px rgba(19, 27, 50, .10); }
        .auth-card .card-body { padding: 2rem; }
        .btn-primary { background: linear-gradient(135deg, #5b5ce2, #3c7de8); border: none; }
        .btn-primary:hover { background: linear-gradient(135deg, #4b4cd6, #2e6bde); }
        .portal-heading { margin-bottom: 1.5rem; }.portal-options { max-width: 820px; margin: 0 auto; }.auth-choice { color: #1b2238; border: 1px solid rgba(91,92,226,.12); border-radius: 20px; box-shadow: 0 18px 45px rgba(19,27,50,.08); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }.auth-choice:hover, .auth-choice:focus { color: #1b2238; transform: translateY(-4px); border-color: rgba(91,92,226,.4); box-shadow: 0 24px 52px rgba(19,27,50,.14); }.auth-choice:focus-visible { outline: 3px solid rgba(22,168,154,.45); outline-offset: 3px; }.choice-icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; font-size: 1.75rem; margin-bottom: 1.2rem; }.student-choice { background: #efefff; }.teacher-choice { background: #e8f8f5; }.back-link { color: #5b5ce2; text-decoration: none; font-size: .85rem; font-weight: 600; }.back-link:hover { text-decoration: underline; }
    </style>
</head>
<body class="bg-light">
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
